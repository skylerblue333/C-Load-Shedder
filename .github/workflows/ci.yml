name: load-shedder-ci

on:
  push:
    branches: [main, "product/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Strict build
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -o app src/main.c
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -O2 -o test_app tests/test_main.c
      - name: Contract tests
        run: ./test_app
      - name: Sanitizer build and tests
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g -o app src/main.c
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -g -o test_app tests/test_main.c
          ASAN_OPTIONS=detect_leaks=1 ./test_app
      - name: CMake build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          (cd build && ./test_app)
      - name: Build image
        run: docker build -t sky-load-shedder:ci .
      - name: Verify non-root image
        run: |
          user="$(docker image inspect sky-load-shedder:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
      - name: Container decision smoke
        run: |
          docker run --rm sky-load-shedder:ci 100 1000 85 | grep -q '"decision":"accept"'
          set +e
          docker run --rm sky-load-shedder:ci 900 1000 85 >/tmp/shed.json
          status=$?
          set -e
          test "$status" -eq 3
          grep -q '"decision":"shed"' /tmp/shed.json
